name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set under Settings → Secrets and variables → Actions. Without the passphrase the build
      # still runs (debug-signed) but nothing is published.
      RELEASE_KEY_PASSPHRASE: ${{ secrets.RELEASE_KEY_PASSPHRASE }}
      DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Decrypt release key
        if: env.RELEASE_KEY_PASSPHRASE != ''
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in app/signing/release.jks.enc -out "$RUNNER_TEMP/release.jks" \
            -pass env:RELEASE_KEY_PASSPHRASE
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK (signed with the release key)
        if: env.RELEASE_KEY_PASSPHRASE != ''
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk WitnessCam.apk

      - name: Build debug APK (no release key available)
        if: env.RELEASE_KEY_PASSPHRASE == ''
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk WitnessCam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: witnesscam-apk
          path: WitnessCam.apk

      # Every release-signed build of main becomes a release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest
      - name: Publish release
        if: env.RELEASE_KEY_PASSPHRASE != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          apk_sha=$(sha256sum WitnessCam.apk | cut -d' ' -f1)
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          cert_sha=$("$apksigner" verify --print-certs WitnessCam.apk | grep -m1 "SHA-256 digest" | sed 's/.*: //')
          {
            echo "Automatic build of $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)"
            echo
            echo "**Verify your download**"
            echo
            echo "- APK SHA-256: \`$apk_sha\`"
            echo "- Signing certificate SHA-256: \`$cert_sha\`"
          } > notes.md
          gh release create "$tag" WitnessCam.apk \
            --target "${{ github.sha }}" \
            --title "WitnessCam build ${{ github.run_number }}" \
            --notes-file notes.md \
            --latest
