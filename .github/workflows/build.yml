name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Print signing certificate (register this SHA-1 in Google Cloud)
        run: keytool -list -v -keystore app/debug.keystore -storepass android | grep -E "SHA1|SHA256:"
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WitnessCam.apk
      - uses: actions/upload-artifact@v4
        with:
          name: witnesscam-debug-apk
          path: WitnessCam.apk
      # Every build of main becomes a release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" WitnessCam.apk \
            --target "${{ github.sha }}" \
            --title "WitnessCam build ${{ github.run_number }}" \
            --notes "Automatic build of $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)" \
            --latest
